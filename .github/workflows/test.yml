# The test suites (devkit.config.json's "suites", .dev/<suite>.mjs) — those
# that connect to Obsidian against a sandboxed one, on the oldest version the
# manifest allows and the newest; the rest in plain Node. obsidian-toolkit's
# reusable workflow. Linux on every push; Windows and macOS on request
# (Actions → Test → Run workflow): their minutes count 2× and 10× on a
# private repository's allowance.
name: Test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites to run, space separated (empty: all)"
        default: ""
      filter:
        description: "Only the cases whose name contains this"
        default: ""
      obsidian:
        description: "Obsidian versions"
        type: choice
        options: [both, latest, earliest]
        default: both
      os:
        description: "Systems"
        type: choice
        options: [linux, windows, windows-arm, windows-all, macos, macos-all, both, desktops, all]
        default: desktops
  # The Release workflow runs the same suites first.
  workflow_call:

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  suites:
    uses: Gelaende51/obsidian-toolkit/.github/workflows/suites.yml@v0.13.0
    with:
      suites: ${{ inputs.suites }}
      filter: ${{ inputs.filter }}
      versions: ${{ inputs.obsidian || 'both' }}
      os: ${{ inputs.os || 'linux' }}
