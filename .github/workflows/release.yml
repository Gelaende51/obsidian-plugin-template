# Releases the plugin: its tests, then obsidian-toolkit's release workflow —
# the directory's preview scan, the release commit (changelogs and version
# files), the tag, the build with a signed provenance attestation on each
# asset, the GitHub release, and the directory's release scan, listing and
# recorded review. Anyone can check the bundle came from this source:
#
#   gh attestation verify main.js --repo <owner>/<repo>
#
# Two ways in: `npm run release -- 1.1.0` (or Actions → Release → Run workflow
# with a version), or a tag pushed by hand, released as it is. Obsidian's
# installer and BRAT read manifest.json on the default branch and then look
# for a release tagged exactly that version — no "v" — so the tag filter stays
# strict: an automated build's x.y.z-deps.n tag never starts a release.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1.0 (no v)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    uses: Gelaende51/obsidian-toolkit/.github/workflows/release.yml@v0.11.1
    # The directory's session (OBSIDIAN_COMMUNITY_COOKIE), when it is set.
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      name: My Plugin
